name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          targets = {'v1.1.0': ('1.1.0', '26.2'), 'v2.1.0': ('2.1.0', '26.3')}
          if os.environ['RELEASE_TAG'] not in targets:
              raise SystemExit('Add the release version and Paper target to the build and release mapping first')
          version, target = targets[os.environ['RELEASE_TAG']]
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Releases require a stable version such as 1.0.0')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Tag must match build.gradle.kts: v{version}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_VERSION={version}\n')
              output.write(f'TARGET_PAPER={target}\n')
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests and build plugin
        run: bash ./gradlew --no-daemon clean test shadowJar -PtargetPaper="$TARGET_PAPER"

      - name: Package and verify release files
        run: python3 tools/package_release.py --target-paper "$TARGET_PAPER"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="dist/AFKDummyLimited-${RELEASE_VERSION}"
          gh release create "$RELEASE_TAG" \
            "$release_dir/AFKDummyLimited-${RELEASE_VERSION}.jar" \
            "$release_dir/AFKDummyLimited-${RELEASE_VERSION}-sources.zip" \
            "$release_dir/SHA256SUMS" \
            --verify-tag --draft \
            --title "AFKDummyLimited ${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_VERSION}.md"
          if [ "$TARGET_PAPER" = "26.3" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi
